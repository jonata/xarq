name: Build

# Builds the Linux and Windows packages, checks each one starts, and keeps them
# as artifacts of the run. Publishes nothing: run it by hand (Actions → Build →
# Run workflow), or push a packaging/** branch, to test the packaging without a
# release. release.yml calls it, then attaches what it built to the release.

on:
  push:
    branches:
      - 'packaging/**'
  workflow_dispatch:
    inputs:
      version:
        description: Version; empty for the date (YY.MM.DD.HHMM)
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        default: ''
        type: string
    outputs:
      version:
        value: ${{ jobs.plan.outputs.version }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION:-$(date -u +%y.%m.%d.%H%M)}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  # ──────────────────────────────────────────────────────────────
  # Linux: AppImage
  # ──────────────────────────────────────────────────────────────
  appimage:
    needs: plan
    # The AppImage runs on systems at least as new as this (glibc 2.39).
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries to build with and bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(grep -v '^#' .github/scripts/apt-packages.txt)
      - uses: actions/cache@v6
        id: poppler
        with:
          path: poppler-install
          key: poppler-${{ runner.os }}-${{ hashFiles('.github/scripts/build-poppler.sh') }}
      - name: Build Poppler
        if: steps.poppler.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-poppler.sh "$PWD/poppler-install"
      - name: Find Poppler
        run: |
          echo "PKG_CONFIG_PATH=$PWD/poppler-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/poppler-install/lib" >> "$GITHUB_ENV"
      - name: Build XarQ
        working-directory: src
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXARQ_VERSION="$VERSION" | tee ../configure.log
          grep -E 'ENABLED|disabled' ../configure.log || true
          cmake --build build -j"$(nproc)"
      - name: Self-test
        working-directory: src
        run: QT_QPA_PLATFORM=offscreen QT_HASH_SEED=0 ./build/xarq --selftest
      - name: Package
        run: bash .github/scripts/build-appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: XarQ-*.AppImage
      - name: Start it on clean systems
        run: |
          for image in ubuntu:24.04 fedora:latest; do
            echo "::group::$image"
            docker run --rm -v "$PWD":/w -w /w "$image" \
              bash .github/scripts/smoke-appimage.sh "XarQ-$VERSION-x86_64.AppImage"
            echo "::endgroup::"
          done

  # ──────────────────────────────────────────────────────────────
  # Windows: one MSYS2 build, two packages: portable zip, NSIS installer
  # ──────────────────────────────────────────────────────────────
  windows:
    needs: plan
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-ttf-dejavu
            wget
            xz
            zip
      - name: Install the optional libraries MSYS2 has
        # Each one adds formats; one MSYS2 lacks only leaves those out.
        run: |
          for p in $(grep -v '^#' .github/scripts/msys2-optional.txt); do
            pacman -S --needed --noconfirm "mingw-w64-ucrt-x86_64-$p" > /dev/null 2>&1 \
              && echo "installed $p" || echo "::notice::MSYS2 has no $p"
          done
      - uses: actions/cache@v6
        id: poppler
        with:
          path: poppler-install
          key: poppler-${{ runner.os }}-${{ hashFiles('.github/scripts/build-poppler.sh') }}
      - name: Build Poppler
        if: steps.poppler.outputs.cache-hit != 'true'
        env:
          CMAKE_GENERATOR: Ninja
        run: bash .github/scripts/build-poppler.sh "$PWD/poppler-install"
      - name: Find Poppler
        # Its DLL among MSYS2's, where bundle-windows.sh gathers them from.
        run: cp poppler-install/bin/*.dll /ucrt64/bin/
      - name: Build XarQ
        working-directory: src
        # MSYS2's login shell sets PKG_CONFIG_PATH itself, so it can't come from the job's environment.
        run: |
          export PKG_CONFIG_PATH="$PWD/../poppler-install/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXARQ_VERSION="$VERSION" | tee ../configure.log
          grep -E 'ENABLED|disabled' ../configure.log || true
          cmake --build build -- -k 0
      - name: Gather the app's folder
        run: bash .github/scripts/bundle-windows.sh src/build/xarq.exe dist/XarQ
      - name: Self-test
        run: bash .github/scripts/selftest-windows.sh dist/XarQ
      - name: Start it
        # A windowed app that fails shows an error dialog and stays up, so
        # look at its window as well as whether it is still running.
        shell: pwsh
        run: |
          $p = Start-Process dist\XarQ\xarq.exe -PassThru
          Start-Sleep 25
          $p.Refresh()
          if ($p.HasExited) { throw "XarQ exited ($($p.ExitCode))" }
          $title = $p.MainWindowTitle
          Write-Host "Main window: '$title'"
          Stop-Process $p -Force
          if ($title -notmatch 'XarQ') { throw "expected the XarQ window, found '$title'" }
      - name: Portable (zip)
        run: cd dist && zip -qr9 "../XarQ-$VERSION-portable.zip" XarQ
      - name: Installer (NSIS)
        run: |
          makensis -DVERSION="$VERSION" -DSOURCE=dist\\XarQ -DOUTFILE="XarQ-$VERSION-Setup.exe" \
            .github/scripts/xarq-installer.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: XarQ-*-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: XarQ-*-Setup.exe
